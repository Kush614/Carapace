# kind cluster for the Carapace edge fabric (spec §3.1).
# Default CNI (kindnet) does NOT enforce NetworkPolicy, so the "isolate"
# action would not actually cut traffic. We disable it and install Calico
# in demo.sh so the deny-all NetworkPolicy produces *real*, total isolation.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: carapace-edge
networking:
  disableDefaultCNI: true
  podSubnet: "192.168.0.0/16"   # Calico default
nodes:
  - role: control-plane
  - role: worker
  - role: worker
