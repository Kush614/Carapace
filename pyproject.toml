[project]
name = "carapace"
version = "0.1.0"
description = "Action-layer trust boundary that composes on top of Veea's Lobster Trap conversation-layer DPI proxy."
requires-python = ">=3.11"
# The core decision engine has ZERO runtime dependencies by design.
dependencies = []

[project.optional-dependencies]
# Layered on after the core engine.
policy = ["pyyaml>=6"]                                  # policy-pack loaders
api = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2"]  # action-gate service
agent = ["openai>=1.30"]                                 # Gemini via OpenAI-compat
dev = ["pytest>=8", "httpx>=0.27", "pyyaml>=6"]

[tool.pytest.ini_options]
# Run tests against the source tree without an install step.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
